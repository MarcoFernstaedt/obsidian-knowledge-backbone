# obsidian-kb example configuration

[vault]
# Path to the Obsidian vault root
path = "/example/vault"

[state]
# SQLite state file for FTS5 index
sqlite_path = "index.sqlite"

# Directory for logs, audit state, exclusions
log_dir = "logs"

[qdrant]
url = "http://localhost:6333"
collection = "obsidian_kb_notes"
model = "nomic-embed-text"

[exclusions]
# Directory and glob patterns to exclude (relative to vault)
folders = [ ".git", ".obsidian", ".trash", "templates" ]
globs = [ "*secret*", "*private*" ]

# Exclude any file containing these secret patterns (case-insensitive regex)
secret_patterns = [ "PRIVATE KEY", "API[_-]?KEY", "SECRET", "PASSWORD", "BEGIN [A-Z ]*PRIVATE KEY", "aws_access_key_id", "aws_secret_access_key" ]

# Do not index sections with 'semantic_index: false' in frontmatter


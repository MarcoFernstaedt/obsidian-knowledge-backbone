[vault]
path = "/path/to/your/Obsidian-vault"

[state]
sqlite_path = "/path/to/operator-state/obsidian-kb.sqlite3"

[exclusions]
hidden = true
folders = [".git", ".obsidian", ".trash", "Templates"]
globs = ["Private/**", "**/*.private.md"]
frontmatter_false_keys = ["index", "semantic_index", "knowledge_index"]
secret_patterns = []

[chunking]
max_lines = 60
max_chars = 6000

[semantic]
ollama_url = "http://127.0.0.1:11434"
ollama_model = "nomic-embed-text"
qdrant_url = "http://127.0.0.1:6333"
collection = "obsidian_knowledge"
vector_size = 768
timeout = 10.0

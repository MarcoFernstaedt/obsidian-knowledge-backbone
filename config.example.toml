schema_version = 1
corpus_id = "curated-obsidian"

[vault]
path = "/path/to/your/Obsidian-vault"

[exclusions]
hidden = true
include_globs = ["*.md", "**/*.md"]
folders = [".git", ".obsidian", ".stfolder", ".trash", "Templates", "node_modules", "__pycache__", "logs", "sessions"]
globs = ["**/*session-dump*", "**/*task-queue*", "**/*.excalidraw.md", "Private/**", "**/*.private.md"]
frontmatter_false_keys = ["index", "knowledge_index"]
secret_patterns = []

[chunking]
max_lines = 60
max_chars = 1200
overlap_lines = 2
maximum_note_bytes = 2097152

[resources]
maximum_files = 5000
maximum_chunks = 50000
maximum_total_bytes = 268435456

[project]
name = "obsidian-knowledge-backbone"
version = "1.0.0"
description = "Privacy-bound hybrid citation search for curated Obsidian vaults"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Marco Fernstaedt"}]
dependencies = []
keywords = ["obsidian", "sqlite", "fts5", "qdrant", "ollama", "hermes"]

[project.scripts]
obsidian-kb = "obsidian_kb.cli:main"
imperator-knowledge = "obsidian_kb.cli:main"
imperator-search = "obsidian_kb.cli:imperator_search_main"
imperator-vault-index = "obsidian_kb.cli:imperator_vault_index_main"

[project.entry-points."hermes_agent.plugins"]
obsidian-retrieval = "hermes_plugin"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["obsidian_kb", "hermes_plugin"]
include-package-data = false

[tool.setuptools.package-data]
hermes_plugin = ["plugin.yaml", "skills/*/SKILL.md"]

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q obsidian_kb hermes_plugin tests
      - name: Build and isolated install
        run: |
          python -m pip install --disable-pip-version-check 'build==1.5.0'
          python -m build
          python -m venv /tmp/obsidian-kb-install
          /tmp/obsidian-kb-install/bin/pip install --disable-pip-version-check --no-deps dist/*.whl
          /tmp/obsidian-kb-install/bin/obsidian-kb --help
